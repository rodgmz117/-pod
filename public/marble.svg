<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
  <defs>
    <filter id="veins" x="0%" y="0%" width="100%" height="100%" color-interpolation-filters="sRGB">
      <!-- Warp field to make veins curve organically -->
      <feTurbulence type="fractalNoise" baseFrequency="0.04 0.02" numOctaves="3" seed="7" result="warp"/>
      <!-- Primary vein turbulence — very low freq for long sweeping veins -->
      <feTurbulence type="fractalNoise" baseFrequency="0.009 0.003" numOctaves="5" seed="22" result="base"/>
      <!-- Displace veins with warp field for organic curves -->
      <feDisplacementMap in="base" in2="warp" scale="180" xChannelSelector="R" yChannelSelector="G" result="warped"/>
      <!-- Tent function: bright only near 0.5 → thin vein lines -->
      <feComponentTransfer in="warped" result="veins">
        <feFuncR type="table" tableValues="0 0 0.05 1 0.05 0 0"/>
        <feFuncG type="table" tableValues="0 0 0.04 0.88 0.04 0 0"/>
        <feFuncB type="table" tableValues="0 0 0.02 0.72 0.02 0 0"/>
        <feFuncA type="linear" slope="1"/>
      </feComponentTransfer>
      <!-- Slight softening so veins feel like stone not pixels -->
      <feGaussianBlur stdDeviation="0.6" in="veins"/>
    </filter>

    <filter id="base-texture" x="0%" y="0%" width="100%" height="100%" color-interpolation-filters="sRGB">
      <!-- Subtle base variation so the stone isn't flat -->
      <feTurbulence type="fractalNoise" baseFrequency="0.025 0.015" numOctaves="4" seed="3"/>
      <feColorMatrix type="matrix"
        values="0.12 0 0 0 0.22
                0.04 0 0 0 0.05
                0.06 0 0 0 0.08
                0    0 0 0 1"/>
    </filter>
  </defs>

  <!-- Deep wine base -->
  <rect width="100%" height="100%" fill="#3C0E18"/>
  <!-- Subtle stone tonal variation -->
  <rect width="100%" height="100%" filter="url(#base-texture)" opacity="0.55"/>
  <!-- Cream veins -->
  <rect width="100%" height="100%" filter="url(#veins)" opacity="0.55"/>
</svg>
