<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
  <defs>
    <filter id="paint" x="0%" y="0%" width="100%" height="100%" color-interpolation-filters="sRGB">
      <!-- Large sweeping color patches — painterly wash base -->
      <feTurbulence type="fractalNoise" baseFrequency="0.018 0.012" numOctaves="6" seed="5" result="base"/>
      <!-- Map turbulence into wine/mauve/terracotta palette -->
      <feColorMatrix type="matrix"
        values="0.55 0.30 0.10 0 0.08
                0.05 0.06 0.03 0 0.03
                0.12 0.10 0.15 0 0.06
                0    0    0    0 1"
        in="base" result="painted"/>
      <!-- Finer grain layer -->
      <feTurbulence type="fractalNoise" baseFrequency="0.06 0.04" numOctaves="3" seed="13" result="detail"/>
      <feColorMatrix type="matrix"
        values="0.20 0.10 0.05 0 0
                0.02 0.03 0.01 0 0
                0.05 0.04 0.06 0 0
                0    0    0    0 1"
        in="detail" result="grain"/>
      <!-- Blend both layers -->
      <feBlend in="painted" in2="grain" mode="screen" result="blended"/>
      <!-- Slight contrast boost -->
      <feComponentTransfer in="blended">
        <feFuncR type="gamma" amplitude="1" exponent="0.85" offset="0"/>
        <feFuncG type="gamma" amplitude="1" exponent="0.9"  offset="0"/>
        <feFuncB type="gamma" amplitude="1" exponent="0.88" offset="0"/>
      </feComponentTransfer>
    </filter>
  </defs>
  <rect width="100%" height="100%" filter="url(#paint)"/>
</svg>
