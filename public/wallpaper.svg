<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <!--
    Toile-style botanical — drawn as engraved line work, not filled silhouettes.
    All in wine/burgundy tonal family, darker than the #5E1828 background.
    Sparse: three loose groupings with breathing room.
  -->
  <defs>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="0.7"/>
    </filter>
  </defs>

  <!-- ══════════════════════════════════════════
       GROUPING A — Large rose cluster, left side
  ══════════════════════════════════════════ -->
  <g transform="translate(210, 450)" filter="url(#soft)"
     stroke="#2C0A12" stroke-linecap="round" stroke-linejoin="round" fill="none">

    <!-- STEM down to bottom -->
    <path d="M 0 40 C -4 70, -8 110, -12 145" stroke-width="2.2" opacity="0.65"/>
    <!-- side stem right -->
    <path d="M -2 80 C 18 78, 40 72, 58 60" stroke-width="1.6" opacity="0.55"/>
    <!-- side stem left -->
    <path d="M -6 100 C -28 98, -50 88, -65 72" stroke-width="1.4" opacity="0.50"/>

    <!-- ROSE A (open, ~55px radius) — stroke-based toile style -->
    <!-- Outermost petals showing their backs: wide arcs curling away -->
    <path d="M -42 28 C -60 14, -68 -10, -58 -32 C -48 -52, -28 -60, -10 -56"
          stroke-width="1.4" opacity="0.62"/>
    <path d="M 42 28 C 60 14, 68 -10, 58 -32 C 48 -52, 28 -60, 10 -56"
          stroke-width="1.4" opacity="0.62"/>
    <path d="M -18 46 C -10 62, 10 66, 28 56 C 44 46, 50 28, 44 12"
          stroke-width="1.4" opacity="0.58"/>
    <path d="M 18 46 C 10 62, -10 66, -28 56 C -44 46, -50 28, -44 12"
          stroke-width="1.4" opacity="0.58"/>

    <!-- Outer face-on petals -->
    <path d="M -36 20 C -52 8, -56 -14, -46 -34 C -36 -52, -18 -58, 0 -55"
          stroke-width="1.3" opacity="0.58"/>
    <path d="M 36 20 C 52 8, 56 -14, 46 -34 C 36 -52, 18 -58, 0 -55"
          stroke-width="1.3" opacity="0.58"/>
    <path d="M 0 45 C 16 56, 36 50, 44 34 C 52 18, 46 -2, 34 -12"
          stroke-width="1.3" opacity="0.55"/>
    <path d="M 0 45 C -16 56, -36 50, -44 34 C -52 18, -46 -2, -34 -12"
          stroke-width="1.3" opacity="0.55"/>

    <!-- Middle petals -->
    <path d="M -24 18 C -38 8, -42 -10, -34 -28 C -26 -44, -12 -50, 0 -48"
          stroke-width="1.2" opacity="0.65"/>
    <path d="M 24 18 C 38 8, 42 -10, 34 -28 C 26 -44, 12 -50, 0 -48"
          stroke-width="1.2" opacity="0.65"/>
    <path d="M -12 30 C -4 44, 12 46, 24 36 C 36 26, 38 10, 28 0"
          stroke-width="1.2" opacity="0.62"/>
    <path d="M 12 30 C 4 44, -12 46, -24 36 C -36 26, -38 10, -28 0"
          stroke-width="1.2" opacity="0.62"/>
    <path d="M -18 10 C -30 2, -34 -14, -26 -30 C -18 -44, -4 -48, 8 -44"
          stroke-width="1.1" opacity="0.68"/>
    <path d="M 18 10 C 30 2, 34 -14, 26 -30 C 18 -44, 4 -48, -8 -44"
          stroke-width="1.1" opacity="0.68"/>

    <!-- Inner petals — tighter curves -->
    <path d="M -12 8 C -20 2, -22 -10, -16 -22 C -10 -32, -2 -36, 4 -34"
          stroke-width="1.0" opacity="0.72"/>
    <path d="M 12 8 C 20 2, 22 -10, 16 -22 C 10 -32, 2 -36, -4 -34"
          stroke-width="1.0" opacity="0.72"/>
    <path d="M 0 16 C 8 22, 18 18, 20 8 C 22 -2, 16 -12, 8 -14"
          stroke-width="1.0" opacity="0.70"/>
    <path d="M 0 16 C -8 22, -18 18, -20 8 C -22 -2, -16 -12, -8 -14"
          stroke-width="1.0" opacity="0.70"/>

    <!-- Tight center spiral -->
    <path d="M -6 0 C -10 -4, -10 -12, -4 -16 C 2 -20, 8 -16, 8 -10 C 8 -4, 4 0, 0 0"
          stroke-width="0.9" opacity="0.80"/>
    <circle cx="0" cy="-4" r="4" fill="#2C0A12" opacity="0.75"/>

    <!-- LEAVES on rose stem -->
    <!-- Compound leaf right (~58, 60) -->
    <g transform="translate(58, 60)">
      <!-- leaf stem -->
      <path d="M 0 0 C 8 -8, 18 -20, 24 -32" stroke-width="1.2" opacity="0.55"/>
      <!-- leaflets (simple, serrated suggestion) -->
      <path d="M 6 -6 C 0 -14, 2 -26, 10 -30 C 18 -26, 20 -14, 14 -8 Z"
            fill="#2C0A12" fill-opacity="0.50" stroke-width="0.8" opacity="0.60"/>
      <path d="M 6 -6 L 10 -18" stroke-width="0.7" opacity="0.45"/>
      <path d="M 14 -16 C 8 -22, 10 -34, 18 -38 C 26 -34, 26 -22, 20 -18 Z"
            fill="#2C0A12" fill-opacity="0.45" stroke-width="0.8" opacity="0.55"/>
      <path d="M 14 -16 L 18 -28" stroke-width="0.7" opacity="0.42"/>
    </g>
    <!-- Simple leaf left (~-65, 72) -->
    <g transform="translate(-65, 72)">
      <path d="M 0 0 C -10 -12, -12 -28, -6 -40 C 0 -50, 10 -50, 14 -40 C 18 -28, 14 -12, 0 0 Z"
            fill="#2C0A12" fill-opacity="0.48" stroke-width="0.9" opacity="0.58"/>
      <path d="M 0 0 L -2 -40" stroke-width="0.7" opacity="0.42"/>
      <!-- serration suggestion -->
      <path d="M -8 -22 L -14 -26 M -4 -32 L -10 -36" stroke-width="0.6" opacity="0.38"/>
    </g>
    <!-- leaf behind rose upper left -->
    <g transform="translate(-55, -45) rotate(-30)">
      <path d="M 0 0 C -8 -10, -10 -24, -4 -34 C 2 -42, 10 -42, 14 -34 C 18 -24, 14 -10, 0 0 Z"
            fill="#2C0A12" fill-opacity="0.42" stroke-width="0.9" opacity="0.52"/>
      <path d="M 0 0 L 4 -34" stroke-width="0.7" opacity="0.38"/>
    </g>
  </g>

  <!-- Smaller rose bud below main rose -->
  <g transform="translate(272, 545)" filter="url(#soft)"
     stroke="#2C0A12" stroke-linecap="round" fill="none">
    <path d="M 0 22 C -2 40, -4 58, -6 75" stroke-width="1.8" opacity="0.55"/>
    <!-- bud outer -->
    <path d="M -18 14 C -28 4, -30 -10, -22 -24 C -14 -36, -2 -40, 0 -38"
          stroke-width="1.2" opacity="0.58"/>
    <path d="M 18 14 C 28 4, 30 -10, 22 -24 C 14 -36, 2 -40, 0 -38"
          stroke-width="1.2" opacity="0.58"/>
    <path d="M -10 18 C -16 26, -6 34, 6 30 C 16 26, 20 14, 14 6"
          stroke-width="1.2" opacity="0.55"/>
    <!-- inner -->
    <path d="M -8 6 C -14 0, -14 -12, -6 -20 C 0 -26, 8 -24, 10 -16"
          stroke-width="1.0" opacity="0.68"/>
    <path d="M 8 6 C 14 0, 14 -12, 6 -20 C 0 -26, -8 -24, -10 -16"
          stroke-width="1.0" opacity="0.68"/>
    <path d="M -4 0 C -6 -6, -4 -14, 0 -16 C 4 -14, 6 -6, 4 0" stroke-width="0.9" opacity="0.75"/>
    <!-- leaf -->
    <path d="M -2 36 C -12 28, -14 14, -8 4 C -2 -4, 6 -2, 8 6 C 10 14, 6 26, -2 36 Z"
          fill="#2C0A12" fill-opacity="0.40" stroke-width="0.9" opacity="0.50"/>
    <path d="M -2 36 L 0 4" stroke-width="0.7" opacity="0.38"/>
  </g>

  <!-- ══════════════════════════════════════════
       GROUPING B — Bird + branch, center area
  ══════════════════════════════════════════ -->
  <g transform="translate(720, 310)" filter="url(#soft)"
     stroke="#2C0A12" stroke-linecap="round" stroke-linejoin="round" fill="none">

    <!-- BRANCH -->
    <path d="M -180 120 C -120 90, -60 55, 0 30 C 60 5, 120 -10, 180 -28"
          stroke-width="3" opacity="0.55"/>
    <!-- small twig up -->
    <path d="M -40 60 C -50 38, -52 15, -46 -5" stroke-width="1.6" opacity="0.45"/>
    <!-- small twig down -->
    <path d="M 60 18 C 68 38, 72 58, 68 78" stroke-width="1.5" opacity="0.42"/>
    <!-- tiny twig -->
    <path d="M 120 -6 C 126 -20, 132 -34, 135 -50" stroke-width="1.2" opacity="0.38"/>

    <!-- Leaves on branch -->
    <g transform="translate(-80, 72)">
      <path d="M 0 0 C -6 -10, -8 -22, -4 -32 C 0 -40, 6 -40, 8 -32 C 10 -22, 6 -10, 0 0 Z"
            fill="#2C0A12" fill-opacity="0.42" stroke-width="0.9" opacity="0.52"/>
      <path d="M 0 0 L 0 -32" stroke-width="0.7" opacity="0.40"/>
    </g>
    <g transform="translate(-50, 65) rotate(15)">
      <path d="M 0 0 C -5 -8, -6 -18, -2 -26 C 2 -32, 6 -32, 8 -26 C 10 -18, 8 -8, 0 0 Z"
            fill="#2C0A12" fill-opacity="0.40" stroke-width="0.8" opacity="0.50"/>
      <path d="M 0 0 L 2 -26" stroke-width="0.6" opacity="0.38"/>
    </g>
    <g transform="translate(68, 78) rotate(-20)">
      <path d="M 0 0 C -6 -10, -7 -22, -3 -31 C 1 -38, 7 -38, 9 -31 C 11 -22, 8 -10, 0 0 Z"
            fill="#2C0A12" fill-opacity="0.40" stroke-width="0.9" opacity="0.50"/>
      <path d="M 0 0 L 1 -31" stroke-width="0.6" opacity="0.38"/>
    </g>
    <g transform="translate(135, -50) rotate(-10)">
      <!-- compound small leaves -->
      <path d="M 0 0 C -4 -8, -6 -18, -2 -26 C 2 -32, 6 -32, 7 -26 C 8 -18, 5 -8, 0 0 Z"
            fill="#2C0A12" fill-opacity="0.38" stroke-width="0.8" opacity="0.48"/>
      <path d="M 0 0 C 5 -6, 8 -16, 6 -24 C 4 -30, 0 -30, -1 -24"
            stroke-width="0.8" opacity="0.42"/>
    </g>
    <!-- Berries on lower twig -->
    <g transform="translate(60, 68)">
      <circle cx="-4" cy="0" r="5" fill="#2C0A12" fill-opacity="0.55" stroke-width="0.8" opacity="0.60"/>
      <circle cx="6"  cy="4" r="4.5" fill="#2C0A12" fill-opacity="0.50" stroke-width="0.8" opacity="0.55"/>
      <circle cx="-2" cy="10" r="4" fill="#2C0A12" fill-opacity="0.48" stroke-width="0.8" opacity="0.52"/>
      <path d="M -4 -5 L -3 -16 M 6 -0.5 L 7 -12 M -2 6 L -1 -5"
            stroke-width="0.8" opacity="0.40"/>
    </g>

    <!-- BIRD — elegant, perching on branch near center -->
    <g transform="translate(0, 18)">
      <!-- tail feathers - long, graceful lines -->
      <path d="M -22 8 C -38 14, -55 22, -70 18 C -82 14, -85 6, -78 0"
            stroke-width="1.5" opacity="0.62"/>
      <path d="M -22 10 C -40 20, -58 30, -75 28 C -88 26, -90 18, -82 12"
            stroke-width="1.2" opacity="0.55"/>
      <path d="M -20 12 C -36 24, -52 36, -68 38 C -80 38, -84 30, -76 22"
            stroke-width="1.0" opacity="0.48"/>
      <!-- body (filled ellipse rotated) -->
      <ellipse cx="0" cy="2" rx="22" ry="12" fill="#2C0A12" fill-opacity="0.55"
               stroke-width="1.0" opacity="0.65" transform="rotate(-8)"/>
      <!-- wing detail lines -->
      <path d="M -14 -6 C -4 -14, 8 -16, 18 -12" stroke-width="1.0" opacity="0.55"/>
      <path d="M -10 -2 C 0 -10, 12 -12, 20 -8"  stroke-width="0.8" opacity="0.48"/>
      <!-- head -->
      <circle cx="22" cy="-6" r="10" fill="#2C0A12" fill-opacity="0.60" stroke-width="1.0" opacity="0.65"/>
      <!-- beak -->
      <path d="M 32 -8 L 42 -11 L 38 -5 Z" fill="#2C0A12" fill-opacity="0.70" stroke-width="0.6"/>
      <!-- eye -->
      <circle cx="26" cy="-9" r="2.5" fill="#5E1828" opacity="0.90"/>
      <circle cx="26" cy="-9" r="1.2" fill="#0A0208" opacity="0.95"/>
      <!-- feet -->
      <path d="M 6 12 L 4 22 M 4 22 L 0 28 M 4 22 L 8 28 M 4 22 L 4 30"
            stroke-width="1.2" opacity="0.55"/>
      <path d="M 14 14 L 12 24 M 12 24 L 8 30 M 12 24 L 16 30"
            stroke-width="1.2" opacity="0.52"/>
    </g>
  </g>

  <!-- Small second bird (in flight), upper right area -->
  <g transform="translate(1050, 210)" filter="url(#soft)"
     stroke="#2C0A12" stroke-linecap="round" fill="none">
    <ellipse cx="0" cy="0" rx="14" ry="7" fill="#2C0A12" fill-opacity="0.45"
             stroke-width="1.0" opacity="0.55" transform="rotate(-12)"/>
    <path d="M -5 -2 C -16 -14, -28 -18, -36 -12" stroke-width="1.5" opacity="0.55"/>
    <path d="M 5 -2 C 16 -14, 27 -18, 34 -12"  stroke-width="1.5" opacity="0.55"/>
    <circle cx="14" cy="-3" r="7" fill="#2C0A12" fill-opacity="0.48" stroke-width="1.0" opacity="0.58"/>
    <path d="M 21 -4 L 28 -7 L 25 -1 Z" fill="#2C0A12" fill-opacity="0.60" stroke-width="0.6"/>
    <!-- tail -->
    <path d="M -14 4 C -24 8, -34 6, -38 0" stroke-width="1.2" opacity="0.50"/>
    <path d="M -14 6 C -22 12, -30 12, -34 6" stroke-width="1.0" opacity="0.44"/>
  </g>

  <!-- ══════════════════════════════════════════
       GROUPING C — small flower cluster + leaves, right side
  ══════════════════════════════════════════ -->
  <g transform="translate(1150, 480)" filter="url(#soft)"
     stroke="#2C0A12" stroke-linecap="round" stroke-linejoin="round" fill="none">

    <!-- Stem -->
    <path d="M 0 60 C -2 30, 0 0, 4 -35 C 8 -68, 14 -95, 18 -125"
          stroke-width="2" opacity="0.52"/>
    <!-- branch left -->
    <path d="M 4 -10 C -14 -20, -34 -28, -52 -32" stroke-width="1.4" opacity="0.44"/>
    <!-- branch right -->
    <path d="M 8 -50 C 22 -58, 38 -60, 52 -58" stroke-width="1.4" opacity="0.42"/>

    <!-- Small rose/flower A at top -->
    <g transform="translate(18, -125)">
      <path d="M -14 10 C -22 2, -24 -10, -16 -22 C -8 -32, 0 -34, 0 -32"
            stroke-width="1.1" opacity="0.60"/>
      <path d="M 14 10 C 22 2, 24 -10, 16 -22 C 8 -32, 0 -34, 0 -32"
            stroke-width="1.1" opacity="0.60"/>
      <path d="M -8 14 C -2 22, 10 20, 16 10 C 20 2, 16 -8, 10 -10"
            stroke-width="1.1" opacity="0.58"/>
      <path d="M 8 14 C 2 22, -10 20, -16 10 C -20 2, -16 -8, -10 -10"
            stroke-width="1.1" opacity="0.58"/>
      <path d="M -8 4 C -14 -2, -14 -12, -8 -18 C -2 -24, 4 -22, 6 -16"
            stroke-width="1.0" opacity="0.68"/>
      <path d="M 8 4 C 14 -2, 14 -12, 8 -18 C 2 -24, -4 -22, -6 -16"
            stroke-width="1.0" opacity="0.68"/>
      <circle cx="0" cy="-4" r="5" fill="#2C0A12" fill-opacity="0.60" stroke-width="0.8" opacity="0.70"/>
    </g>

    <!-- Leaves on right stem -->
    <g transform="translate(-52, -32) rotate(20)">
      <path d="M 0 0 C -5 -10, -6 -22, -2 -30 C 2 -36, 6 -36, 8 -30 C 10 -22, 6 -10, 0 0 Z"
            fill="#2C0A12" fill-opacity="0.40" stroke-width="0.8" opacity="0.50"/>
      <path d="M 0 0 L 2 -30" stroke-width="0.6" opacity="0.38"/>
      <!-- serration lines -->
      <path d="M -4 -14 L -8 -18 M -2 -22 L -6 -26" stroke-width="0.5" opacity="0.34"/>
    </g>
    <g transform="translate(52, -58) rotate(-15)">
      <path d="M 0 0 C -6 -10, -8 -22, -3 -32 C 1 -40, 7 -40, 9 -32 C 11 -22, 8 -10, 0 0 Z"
            fill="#2C0A12" fill-opacity="0.38" stroke-width="0.8" opacity="0.48"/>
      <path d="M 0 0 L 3 -32" stroke-width="0.6" opacity="0.36"/>
    </g>
    <g transform="translate(6, 20) rotate(5)">
      <path d="M 0 0 C -7 -12, -8 -26, -3 -37 C 2 -46, 8 -46, 10 -37 C 12 -26, 8 -12, 0 0 Z"
            fill="#2C0A12" fill-opacity="0.42" stroke-width="0.9" opacity="0.52"/>
      <path d="M 0 0 L 2 -37" stroke-width="0.7" opacity="0.40"/>
    </g>
  </g>

  <!-- ══════════════════════════════════════════
       SCATTERED SMALL ELEMENTS — sparse filler
  ══════════════════════════════════════════ -->

  <!-- Tiny flower cluster upper left area -->
  <g transform="translate(440, 165)" filter="url(#soft)"
     stroke="#2C0A12" stroke-linecap="round" fill="none">
    <path d="M 0 50 C 0 30, 2 10, 5 -10 C 8 -30, 12 -48, 14 -65"
          stroke-width="1.5" opacity="0.42"/>
    <!-- small flower top -->
    <g transform="translate(14, -65)">
      <path d="M -8 6 C -14 0, -14 -8, -8 -14 C -2 -20, 4 -18, 6 -12"
            stroke-width="1.0" opacity="0.55"/>
      <path d="M 8 6 C 14 0, 14 -8, 8 -14 C 2 -20, -4 -18, -6 -12"
            stroke-width="1.0" opacity="0.55"/>
      <path d="M 0 8 C 6 14, 12 10, 12 2 C 12 -4, 8 -10, 4 -10"
            stroke-width="0.9" opacity="0.52"/>
      <path d="M 0 8 C -6 14, -12 10, -12 2 C -12 -4, -8 -10, -4 -10"
            stroke-width="0.9" opacity="0.52"/>
      <circle cx="0" cy="-2" r="4" fill="#2C0A12" fill-opacity="0.55" stroke-width="0.7" opacity="0.65"/>
    </g>
    <!-- leaf on stem -->
    <path d="M 4 -5 C -5 -12, -7 -26, -2 -36 C 3 -44, 9 -44, 11 -36 C 13 -26, 9 -12, 4 -5 Z"
          fill="#2C0A12" fill-opacity="0.36" stroke-width="0.8" opacity="0.46"/>
    <path d="M 4 -5 L 5 -36" stroke-width="0.6" opacity="0.36"/>
  </g>

  <!-- Single leaf, isolated, lower center -->
  <g transform="translate(600, 700) rotate(-25)" filter="url(#soft)"
     stroke="#2C0A12" fill="none">
    <path d="M 0 0 C -10 -14, -12 -32, -6 -46 C 0 -58, 8 -58, 12 -46 C 16 -32, 12 -14, 0 0 Z"
          fill="#2C0A12" fill-opacity="0.38" stroke-width="1.0" opacity="0.48"/>
    <path d="M 0 0 L 2 -46" stroke-width="0.7" opacity="0.38"/>
    <path d="M -6 -22 L -10 -28 M -4 -32 L -8 -38" stroke-width="0.5" opacity="0.32"/>
  </g>

  <!-- Hanging tendril / small cascading element upper right of center -->
  <g transform="translate(870, 120)" filter="url(#soft)"
     stroke="#2C0A12" stroke-linecap="round" fill="none">
    <path d="M 0 0 C 4 20, 2 45, -2 68 C -6 92, -10 115, -8 138"
          stroke-width="1.4" opacity="0.40"/>
    <!-- tiny paired leaves along tendril -->
    <path d="M 0 25 C -8 20, -12 10, -8 4 C -4 -2, 2 0, 2 6"
          fill="#2C0A12" fill-opacity="0.32" stroke-width="0.7" opacity="0.42"/>
    <path d="M 0 25 C 8 18, 14 8, 10 2 C 6 -4, 0 -2, 0 6"
          fill="#2C0A12" fill-opacity="0.32" stroke-width="0.7" opacity="0.40"/>
    <path d="M -2 60 C -10 54, -14 44, -10 38 C -6 32, 0 34, 0 40"
          fill="#2C0A12" fill-opacity="0.30" stroke-width="0.7" opacity="0.40"/>
    <path d="M -2 60 C 6 52, 12 42, 8 36 C 4 30, -2 32, -2 40"
          fill="#2C0A12" fill-opacity="0.30" stroke-width="0.7" opacity="0.38"/>
    <path d="M -4 100 C -12 94, -15 84, -11 78 C -7 72, -2 74, -2 80"
          fill="#2C0A12" fill-opacity="0.28" stroke-width="0.7" opacity="0.36"/>
  </g>

</svg>
