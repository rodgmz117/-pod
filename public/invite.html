<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Rod Gomez & Paean Wang are getting married on March 27, 2027 at Montage Laguna Beach. You're invited." />

    <meta property="og:title" content="You're Invited — Rod & Paean" />
    <meta property="og:description" content="March 27, 2027 · Montage Laguna Beach" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.rodandpae.com/invite" />
    <meta property="og:image" content="https://www.rodandpae.com/invite-card-v4.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="You're Invited — Rod & Paean" />
    <meta name="twitter:description" content="March 27, 2027 · Montage Laguna Beach" />
    <meta name="twitter:image" content="https://www.rodandpae.com/invite-card-v4.jpg" />

    <title>You're Invited — Rod & Paean</title>

    <style>
      @font-face {
        font-family: 'Reckless';
        src: url('/fonts/reckless-variable.ttf') format('truetype-variations');
        font-weight: 100 900;
        font-stretch: 50% 150%;
        font-style: normal;
        font-display: swap;
      }

      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; overflow: hidden; }
      body {
        height: 100svh;
        background: #2A0810;
        font-family: 'Reckless', Georgia, serif;
        font-variation-settings: 'wght' 400, 'CNTR' 50, 'wdth' 100;
      }

      /* Full-bleed: the card fills the entire screen edge-to-edge (object-fit:
         cover) rather than sitting "contained" with padding around it — on a
         phone whose aspect ratio doesn't match the card's, contain-fit always
         leaves visible dead space no matter how tight the margins get, since
         one axis will always come up short. Cover crops slightly into the
         card's own blank top/bottom margin instead, which reads as intentional
         full-bleed rather than a floating card. */
      .invite-card {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
      }

      /* Subtle scrim behind the button only, for legibility over the photo
         regardless of exactly where the crop lands */
      .scrim {
        position: fixed;
        left: 0; right: 0; bottom: 0;
        height: 22svh;
        background: linear-gradient(to top, rgba(20,4,7,0.65), rgba(20,4,7,0));
        pointer-events: none;
      }

      .cta-wrap {
        position: fixed;
        left: 50%;
        bottom: 1svh;
        transform: translateX(-50%);
      }

      /* Solid filled CTA — reads as an obvious button rather than the site's
         usual understated underline link, since this page's whole job is
         getting the tap. Same amber-gradient recipe used for primary actions
         elsewhere on the site, square corners to match this page's engraved-
         card aesthetic rather than Admin's rounded utilitarian style. */
      .cta {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 16px 52px;
        background: linear-gradient(160deg, #E0B848 0%, #D07018 55%, #B84010 100%);
        box-shadow: 0 6px 24px rgba(196, 100, 20, 0.45);
        color: #2A0810;
        border: none;
        font-family: 'Reckless', Georgia, serif;
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 0.2em;
        text-decoration: none;
        text-transform: uppercase;
        cursor: pointer;
        transition: box-shadow 0.2s ease, transform 0.2s ease;
      }
      .cta:hover {
        background: linear-gradient(160deg, #ECC858 0%, #E08028 55%, #C85020 100%);
        box-shadow: 0 8px 30px rgba(196, 100, 20, 0.6);
        transform: translateY(-1px);
      }
      .cta:active { transform: translateY(0); box-shadow: 0 4px 16px rgba(196, 100, 20, 0.45); }

      /* Desktop/wide viewports: full-bleed cover is right for a phone (narrow,
         tall — cropping into the card's blank margins), but on a wide screen it
         crops the card down to a tight, badly-zoomed sliver instead. Past this
         breakpoint, switch to a centered, uncropped "show the whole card" card
         with the button in normal flow below it rather than overlaid. */
      @media (min-width: 768px) {
        html, body { overflow: auto; }
        body {
          height: auto;
          min-height: 100svh;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 32px;
          padding: 48px 24px;
        }
        .invite-card {
          position: static;
          left: auto;
          top: auto;
          width: auto;
          height: auto;
          max-width: min(480px, 100%);
          max-height: 80svh;
          transform: none;
          object-fit: contain;
          box-shadow: 0 30px 70px rgba(0,0,0,0.55);
        }
        .scrim { display: none; }
        .cta-wrap { position: static; transform: none; }
      }
    </style>
  </head>
  <body>
    <img class="invite-card" src="/invite-card-v4.jpg" alt="Rod & Paean wedding invitation" />
    <div class="scrim" aria-hidden="true"></div>

    <div class="cta-wrap">
      <a class="cta" href="https://www.rodandpae.com/#rsvp">RSVP</a>
    </div>
  </body>
</html>
